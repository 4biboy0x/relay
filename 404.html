<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>404 · Relay</title>
  <link rel="preload" href="/assets/fonts/Piazzolla-Light.woff2" as="font" type="font/woff2" crossorigin>
  <style>
    @font-face {
      font-family: "Piazzolla";
      src: url("/assets/fonts/Piazzolla-Light.woff2") format("woff2");
      font-style: normal;
      font-weight: 300;
      font-display: swap;
    }
    :root{color-scheme:light dark;--bg:#fff;--text:#18181b;--muted:#71717a;--border:#e4e4e7;--surface:#fff}
    @media(prefers-color-scheme:dark){:root{--bg:#09090b;--text:#f4f4f5;--muted:#a1a1aa;--border:#27272a;--surface:#111113}}
    *{box-sizing:border-box}
    body{margin:0;min-height:100svh;display:grid;place-items:center;padding:24px;background:var(--bg);color:var(--text);font:15px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    main{width:min(100%,360px);text-align:center}
    .wordmark{display:inline-block;margin-bottom:42px;color:var(--text);font-family:"Piazzolla",Georgia,serif;font-size:30px;font-weight:300;letter-spacing:-.045em;line-height:.9;text-decoration:none;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility}
    .code{margin:0 0 8px;color:var(--muted);font-size:12px;letter-spacing:.12em}
    h1{margin:0 0 24px;font-size:22px;font-weight:600;letter-spacing:-.035em}
    .action{display:inline-flex;min-height:40px;align-items:center;justify-content:center;padding:0 16px;border:1px solid var(--border);border-radius:9px;background:var(--surface);color:var(--text);font:inherit;font-size:14px;text-decoration:none;transition:background-color 160ms ease,transform 160ms ease}
    .action:hover{background:color-mix(in srgb,var(--text) 5%,var(--surface))}
    .action:active{transform:translateY(1px)}
    .action:focus-visible{outline:2px solid var(--text);outline-offset:3px}
    @media(prefers-reduced-motion:reduce){.action{transition:none}}
  </style>
</head>
<body>
  <main>
    <a class="wordmark" href="/" aria-label="Relay home">Relay</a>
    <p class="code">404</p>
    <h1>Page not found</h1>
    <a class="action" href="/">Go to Relay</a>
  </main>
</body>
</html>

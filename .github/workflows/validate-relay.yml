name: Validate Relay

on:
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - "Relay — Social interface.html"
      - "package.json"
      - "package-lock.json"
      - "scripts/**"
      - ".github/workflows/validate-relay.yml"

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: relay
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d relay"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/relay
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/relay
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/relay
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma validate
      - run: npx prisma generate
      - run: npm run build
      - run: npm run test:security
      - run: npx prisma migrate deploy
      - run: npm run test:bookmarks

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build

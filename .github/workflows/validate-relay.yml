name: Validate Relay

on:
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - "Relay — Social interface.html"
      - "package.json"
      - "package-lock.json"
      - "scripts/**"
      - ".github/workflows/validate-relay.yml"

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/relay
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/relay
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma validate
      - run: npx prisma generate
      - run: npm run build

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build

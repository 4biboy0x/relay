<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>You’re offline · Relay</title>
  <style>
    :root{color-scheme:light dark;--bg:#fff;--surface:#fff;--text:#18181b;--muted:#71717a;--border:#e4e4e7;--accent:#18181b}
    @media(prefers-color-scheme:dark){:root{--bg:#09090b;--surface:#111113;--text:#f4f4f5;--muted:#a1a1aa;--border:#27272a;--accent:#f4f4f5}}
    *{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;padding:24px;background:var(--bg);color:var(--text);font:15px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    main{width:min(100%,360px);text-align:center}a.wordmark{display:inline-block;margin-bottom:42px;color:var(--text);font-family:Georgia,serif;font-size:29px;letter-spacing:-.06em;text-decoration:none}
    .code{margin:0 0 8px;color:var(--muted);font-size:12px;letter-spacing:.12em;text-transform:uppercase}h1{margin:0;font-size:22px;font-weight:600;letter-spacing:-.035em}p{margin:9px 0 24px;color:var(--muted);font-size:14px}
    .action{display:inline-flex;min-height:40px;align-items:center;justify-content:center;padding:0 16px;border:1px solid var(--border);border-radius:9px;background:var(--surface);color:var(--text);font:inherit;font-size:14px;text-decoration:none;transition:background-color 160ms ease,transform 160ms ease}
    .action:hover{background:color-mix(in srgb,var(--text) 5%,var(--surface))}.action:active{transform:translateY(1px)}
    @media(prefers-reduced-motion:reduce){.action{transition:none}}
  </style>
</head>
<body>
  <main>
    <a class="wordmark" href="/">Relay</a>
    <p class="code">Connection</p>
    <h1>You’re offline</h1>
    <p>Check your connection and try again.</p>
    <a class="action" href="/">Try again</a>
  </main>
</body>
</html>
